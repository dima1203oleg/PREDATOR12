[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "piterface"
version = "1.0.0"
description = "Accessible web remote controller for Piter Face"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Flask>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
prod = ["gunicorn>=23,<24"]

[project.scripts]
piterface-web = "piterface.web:main"

[tool.setuptools.package-data]
piterface = ["static/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

