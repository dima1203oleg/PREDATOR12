apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: predator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/example/predator12.git
    targetRevision: HEAD
    path: deploy/helm/umbrella
    helm:
      releaseName: predator
  destination:
    server: https://kubernetes.default.svc
    namespace: predator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
